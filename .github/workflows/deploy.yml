name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (git pull + compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            cp -n .env.example .env || true
            docker compose up -d --build
            # backend needs a few seconds after recreate — retry instead of failing CI
            for i in $(seq 1 12); do
              if docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=10).read().decode())" 2>/dev/null; then
                break
              fi
              sleep 10
            done
            # pre-warm popular queries so first clicks hit cache, not provider budget
            docker compose exec -T backend python warm.py || true
