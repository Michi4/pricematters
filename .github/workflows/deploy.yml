name: deploy

on:
  push:
    branches: [main]

# overlapping pushes must never interleave git pull + compose up --build
concurrency:
  group: pricematters-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Backend syntax + extractor unit tests
        run: |
          cd backend
          python -m py_compile main.py extractor.py providers.py cache.py feeds.py translate.py track.py affiliate.py ai_extract.py warm.py selfscrape.py amazon_parse.py
          python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend types + build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          node_modules/.bin/tsc --noEmit lib/units.ts --lib es2020 --module esnext --target es2020
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (git pull + compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            if [ ! -f .env ]; then echo "FATAL: .env missing on server" >&2; exit 1; fi
            docker compose up -d --build
            # backend needs a few seconds after recreate — retry instead of failing CI
            ok=""
            for i in $(seq 1 12); do
              if docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=10).read().decode())" 2>/dev/null; then
                ok=1; break
              fi
              sleep 10
            done
            # a dead backend must show as a red X, not a green deploy
            if [ -z "$ok" ]; then echo "FATAL: backend health check failed after 2 min" >&2; exit 1; fi
            # pre-warm popular queries so first clicks hit cache, not provider budget
            docker compose exec -T backend python warm.py || true
