services:
  frontend:
    build: ./frontend
    container_name: pricematters-frontend
    restart: unless-stopped
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      # NOTE: nuxt.config is evaluated at BUILD time, so runtime overrides need
      # the NITRO_/NUXT_ prefixes (read per request, no rebuild needed).
      NUXT_BACKEND_URL: http://backend:8000
      NITRO_BACKEND_URL: http://backend:8000
      NUXT_PUBLIC_DEFAULT_LOCALE: ${NUXT_PUBLIC_DEFAULT_LOCALE:-de-AT}
      NUXT_PUBLIC_AFFILIATE_TAG: ${NUXT_PUBLIC_AFFILIATE_TAG:-websters02-21}
      NUXT_PUBLIC_CANONICAL_HOST: ${NUXT_PUBLIC_CANONICAL_HOST:-pricematters.websters.at}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${ROUTER_NAME}.rule=${ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=http"
      - "traefik.http.routers.${ROUTER_NAME}.middlewares=${ROUTER_NAME}-redirect"
      - "traefik.http.middlewares.${ROUTER_NAME}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${ROUTER_NAME}-secure.rule=${ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}-secure.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_NAME}-secure.middlewares=${ROUTER_NAME}-compress"
      - "traefik.http.middlewares.${ROUTER_NAME}-compress.compress=true"

  backend:
    build: ./backend
    container_name: pricematters-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      REDIS_URL: redis://redis:6379/0
      # email for /contact inquiries (purelymail); unset SMTP_* = DB-only
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TO: ${SMTP_TO:-office@websters.at}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricematters}:${POSTGRES_PASSWORD:-pricematters}@database:5432/${POSTGRES_DB:-pricematters}
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  database:
    container_name: pricematters-db
    image: postgres:16-alpine
    restart: unless-stopped
    # internal only: reachable over app-network, never from the host/internet
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricematters}
      # fail fast instead of silently booting a known password in prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-pricematters}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app-network

  redis:
    container_name: pricematters-redis
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lfu
    restart: unless-stopped
    # internal only: cache poisoning via an exposed redis would mean fake prices
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  db-data:
  redis-data:
