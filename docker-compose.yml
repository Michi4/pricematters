services:
  frontend:
    build: ./frontend
    container_name: pricematters-frontend
    restart: unless-stopped
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      # NOTE: nuxt.config is evaluated at BUILD time, so runtime overrides need
      # the NITRO_/NUXT_ prefixes (read per request, no rebuild needed).
      NITRO_BACKEND_URL: http://backend:8000
      NUXT_PUBLIC_DEFAULT_LOCALE: ${NUXT_PUBLIC_DEFAULT_LOCALE:-de-AT}
      NUXT_PUBLIC_AFFILIATE_TAG: ${NUXT_PUBLIC_AFFILIATE_TAG:-websters0a-21}
      NUXT_PUBLIC_CANONICAL_HOST: ${NUXT_PUBLIC_CANONICAL_HOST:-pricematters.websters.at}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_NAME}.rule=${ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=http"
      - "traefik.http.routers.${ROUTER_NAME}.middlewares=${ROUTER_NAME}-redirect"
      - "traefik.http.middlewares.${ROUTER_NAME}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${ROUTER_NAME}-secure.rule=${ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}-secure.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}-secure.tls.certresolver=letsencrypt"

  backend:
    build: ./backend
    container_name: pricematters-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: database
      DATABASE_URL: postgresql://${POSTGRES_USER:-pricematters}:${POSTGRES_PASSWORD:-pricematters}@database:5432/${POSTGRES_DB:-pricematters}
    expose:
      - "8000"
    depends_on:
      - database
      - redis
    networks:
      - app-network

  database:
    container_name: pricematters-db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricematters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricematters}
      POSTGRES_DB: ${POSTGRES_DB:-pricematters}
    networks:
      - app-network

  redis:
    container_name: pricematters-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  db-data:
  redis-data:
